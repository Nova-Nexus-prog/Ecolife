<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern News Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            color: #333;
             
        }
        nav {
            background-color: #3e8e41;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .logo {
            font-size: 1.5rem;
            color: white;
            font-weight: bold;
        }
        nav ul {
            list-style-type: none;
            display: flex;
            gap: 20px;
        }
        nav ul li {
            display: inline;
        }
        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 1rem;
        }
        nav ul li a:hover {
            text-decoration: underline;
        }
        .container {
            display: flex;
            justify-content: space-between;
             
            margin-top: 20px;
        }
        .news-section {
            width: 70%;
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .news-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .news-title {
            font-size: 32px;
            font-weight: 700;
            color: #2c3e50;
        }
        .news-description {
            margin: 20px 0;
            font-size: 18px;
            line-height: 1.6;
            color: #7f8c8d;
        }
        .news-date {
            font-size: 14px;
            color: #95a5a6;
        }
        .past-news-section {
            width: 25%;
            padding: 10px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-y: scroll;
            max-height: 600px;
        }
        .past-news-item {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background-color: #ecf0f1;
            transition: background-color 0.3s, transform 0.3s;
            cursor: pointer;
        }
        .past-news-item:hover {
            background-color: #bdc3c7;
            transform: translateY(-3px);
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .post-news-btn {
            background-color: #14bd19;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bolder;
            margin-bottom: 20px;
            float: right;
        }
        .post-news-btn:hover {
            background-color: #0cbb17;
        }
        footer {
            background-color: #3e8e41;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
            font-size: 0.9rem;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #bdc3c7;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">Ecolife</div>
        <ul>
            <li><a href="news_upload.html"><button class="post-news-btn">Post News</button></a></li>
             
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Main news section -->
        <div class="news-section">
            <h3 id="latest-news">Latest News</h3>
            
            <div id="main-news">
                <img id="news-image" class="news-image" src="" alt="News Image">
                <div id="header">
                    <div class="news-title" id="news-title">Loading...</div>
                    <div class="news-date" id="news-date"></div>
                </div>
                <div class="news-description" id="news-description"></div>
            </div>
        </div>

        <!-- Past news section -->
        <div class="past-news-section" id="past-news">
            <h3>Past News</h3>
            <!-- Past news items will be dynamically inserted here -->
        </div>
        
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2024 EcoNews. All Rights Reserved.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="news.js"></script>

</body>
</html>
