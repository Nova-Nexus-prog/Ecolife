<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Product</title>
  <link rel="stylesheet" href="add_p.css">
  <!-- Make sure to include Firebase init here -->
</head>
<body>
    <div class="form-container">
        <h1>Add New Product</h1>
        <form id="addProductForm">
          <div class="form-group">
            <label for="productName">Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name" required>
          </div>
          <div class="form-group">
            <label for="productPrice">Price</label>
            <input type="number" id="productPrice" placeholder="Enter product price" required>
          </div>
          <div class="form-group">
            <label for="productCategory">Category</label>
            <input type="text" id="productCategory" placeholder="Enter product category" required>
          </div>
          <div class="form-group">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" placeholder="Enter product description" required></textarea>
          </div>
          <div class="form-group">
            <label for="productImage">Product Image</label>
            <input type="file" id="productImage" accept="image/*" required>
          </div>
          <button type="submit" class="submit-button">Add Product</button>
        </form>
    
        <!-- Progress bar for image upload -->
        <div id="progressContainer" class="progress-container" style="display: none;">
          <div id="progressBar" class="progress-bar"></div>
          <span id="progressText"></span>
        </div>
    
        <div id="statusMessage"></div>
      </div>
    
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="add-product.js"></script>
</body>
</html>
